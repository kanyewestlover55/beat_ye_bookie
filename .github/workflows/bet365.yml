name: Collect bet365 prices
 
on:
  schedule:
    # 10:00 UTC collects last night's games; 16:00 and 21:00 UTC record tonight's fixtures
    - cron: "7 10,16,21 * * *"
  workflow_dispatch: {}
 
permissions:
  contents: write
 
concurrency:
  group: bet365
  cancel-in-progress: false
 
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
 
      - name: Collect bet365 prices from MoviOdds
        run: python3 collect_bet365.py
 
      - name: Save new data to the repo
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/bet365
          git diff --cached --quiet && exit 0
          git commit -m "bet365 prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
 
