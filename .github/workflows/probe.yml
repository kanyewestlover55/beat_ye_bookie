name: Probe bet365 feed
 
on:
  workflow_dispatch: {}
 
permissions:
  contents: write
 
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
 
      - name: Probe MoviOdds bet365 feed
        run: python3 probe_bet365.py
 
      - name: Save results to the repo
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet && exit 0
          git commit -m "bet365 probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
 
