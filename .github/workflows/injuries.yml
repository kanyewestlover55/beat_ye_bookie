name: Collect NBA injury reports

on:
  schedule:
    # every 3 hours; each run catches up on every report it hasn't processed yet
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live (recent reports) or backfill (a date range)"
        default: "backfill"
        type: choice
        options: [backfill, live]
      start:
        description: "Backfill start date, US Eastern (YYYY-MM-DD)"
        default: "2026-10-20"
      end:
        description: "Backfill end date, US Eastern (YYYY-MM-DD)"
        default: "2026-10-29"
      step:
        description: "Minutes between reports: 15 (every report) or 60 (hourly)"
        default: "15"

permissions:
  contents: write

concurrency:
  group: injuries
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packages
        run: pip install nbainjuries pandas

      - name: Collect injury reports
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "backfill" ]; then
            python3 collect_injuries.py --mode backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}" --step "${{ inputs.step }}"
          else
            python3 collect_injuries.py --mode live
          fi

      - name: Save new data to the repo
        if: always()
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/injuries 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "injury reports $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
